org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compiler punya bug lintas-drive di Windows (project di D:,
# Pub cache di C: - "this and base files have different roots" saat menutup
# cache inkremental). Matikan incremental compilation sebagai workaround -
# build jadi sedikit lebih lambat tapi stabil. Lihat juga KT-* di
# youtrack.jetbrains.com kalau versi Kotlin/AGP berikutnya sudah memperbaikinya.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
